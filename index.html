<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文员岗位考试系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#f0f2f5;padding:15px;min-height:100vh}
.container{max-width:800px;margin:0 auto;background:#fff;border-radius:16px;padding:40px 30px;text-align:center}
h1{font-size:28px;margin-bottom:10px}
.sub{color:#888;font-size:16px;margin-bottom:30px}
.exam-list{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.exam-card{background:#f8f9fa;border:2px solid #e0e0e0;border-radius:16px;padding:30px;width:300px;text-align:left;cursor:pointer;transition:all .2s}
.exam-card:hover{border-color:#1a73e8;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.exam-card h3{font-size:18px;margin-bottom:8px;color:#1a73e8}
.exam-card .desc{font-size:14px;color:#555;margin-bottom:12px}
.exam-card .meta{font-size:13px;color:#888;margin-bottom:10px}
.exam-card .btn{display:inline-block;padding:10px 24px;background:#1a73e8;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none}
.info{background:#fff8e1;border-radius:8px;padding:12px;margin:20px 0;border:1px solid #ffe082;color:#856404;font-size:14px}
</style>
</head>
<body>
<div class="container">
  <h1>📋 文员岗位考试系统</h1>
  <div class="sub">物业检查标准 · 文员岗位 · 共2套试卷</div>
  <div class="info">📌 请选择一套试卷开始考试。每套60分及格，可考3次。</div>
  <div class="exam-list">
    <div class="exam-card">
      <h3>📝 试卷（一）</h3>
      <div class="desc">综合管理 + 消防系统</div>
      <div class="meta">30道单选 + 40道判断 | 总分100分</div>
      <a class="btn" href="exam1.html">开始考试 →</a>
    </div>
    <div class="exam-card">
      <h3>📝 试卷（二）</h3>
      <div class="desc">公区管理 + 电气系统</div>
      <div class="meta">30道单选 + 40道判断 | 总分100分</div>
      <a class="btn" href="exam2.html">开始考试 →</a>
    </div>
  </div>
  <div style="margin-top:30px;color:#999;font-size:13px">🤖 每位考生可考3次，成绩自动上报到管理后台</div>
</div>
</body>
</html>
