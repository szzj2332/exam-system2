var timerInterval;
var remaining;

function start(){
  var n=document.getElementById('name').value.trim();
  var p=document.getElementById('park').value.trim();
  var r=document.getElementById('role').value.trim();
  if(!n||!p||!r){alert('请填写完整信息');return}
  document.getElementById('startBtn').disabled=true;
  document.getElementById('q_area').style.display='block';
  var list=document.getElementById('q_list');
  list.innerHTML='';
  Q.questions.forEach(function(q,i){
    var lt={single:'单选',multiple:'多选',judge:'判断'};
    var tc={single:'s',multiple:'m',judge:'j'};
    var card='<div class="q-card"><div class="q-header"><span class="q-typetag">'+lt[q.type]+'</span><span class="q-scoret">'+q.score+' 分</span></div><div class="q-stem">'+(i+1)+'. '+q.stem+'</div><div class="options">';
    q.options.forEach(function(o,j){
      card += '<label><input type="'+(q.type=='judge'?'radio':'checkbox')+'" name="q'+i+'" value="'+j+'"> '+ o +'</label>';
    });
    card += '</div><div class="fb" id="fb'+i+'"></div></div>';
    list.innerHTML+=card;
  });
  var timer=document.getElementById('timer');
  timer.style.display='block';
  remaining=Q.timeLimit*60;
  updateTimer();
  timerInterval=setInterval(function(){
    remaining--;
    updateTimer();
    if(remaining<=0){clearInterval(timerInterval);alert('时间到！');submit();}
  },1000);
}

function updateTimer(){
  var m=Math.floor(remaining/60);
  var s=remaining%60;
  var t=document.getElementById('timer');
  t.innerHTML='⏱ 剩余时间：'+m+'分'+(s<10?'0':'')+s+'秒';
  t.className='timer'+(remaining<300?' warning':'');
}

function submit(){
  if(!confirm('确认提交？'))return;
  clearInterval(timerInterval);
  var score=0,correct=0,wrong=0;
  Q.questions.forEach(function(q,i){
    var ans=[];
    if(q.type=='judge'){var sel=document.querySelector('input[name="q'+i+'"]:checked');ans=sel?[parseInt(sel.value)]:[];}
    else{var checks=document.querySelectorAll('input[name="q'+i+'"]:checked');ans=Array.from(checks).map(function(c){return parseInt(c.value)});}
    var isc=false;
    if(q.type=='single'||q.type=='judge'){isc=ans.length==1&&ans[0]==q.answer;}
    else{var ca=[].concat(q.answer);isc=ans.length==ca.length&&ans.every(function(v){return ca.indexOf(v)>=0});}
    var fb=document.getElementById('fb'+i);
    if(isc){score+=q.score;correct++;fb.className='fb correct';fb.textContent='✓ 正确';}
    else{wrong++;fb.className='fb wrong';fb.textContent='✗ 错误';}
  });
  document.getElementById('submitBtn').disabled=true;
  var rp=document.getElementById('resultPanel');
  rp.style.display='block';
  document.getElementById('r_title').textContent=score>=Q.passScore?'🎉 恭喜通过！':'😢 未通过（需'+Q.passScore+'分）';
  var sd=document.getElementById('scoreDisplay');
  sd.textContent=score+' 分';
  sd.className=score>=Q.passScore?'pass':'fail';
  document.getElementById('resultDetail').innerHTML='正确 '+correct+' 题 | 错误 '+wrong+' 题 | 共 '+Q.questions.length+' 题';
}

document.getElementById('footer').textContent='共'+Q.questions.length+'题 | 满分'+Q.totalScore+'分 | 及格'+Q.passScore+'分';
</script>
