<html lang="zh-CN">
<head>

<title>文员品质综合——品质检查要点全覆盖</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC','Helvetica Neue',sans-serif;background:#f0f2f5;min-height:100vh;display:flex;justify-content:center;padding:20px}
.container{max-width:800px;width:100%;background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);padding:30px 35px;margin:20px auto}
h1{text-align:center;font-size:24px;color:#1a1a2e;margin-bottom:8px;font-weight:700}
.subtitle{text-align:center;color:#888;font-size:14px;margin-bottom:20px;border-bottom:1px solid #eee;padding-bottom:15px}

/* 考生信息表单 */
.info-form{background:#f8f9fa;border-radius:12px;padding:20px;margin-bottom:20px;display:block}
.info-form h3{font-size:16px;color:#1a1a2e;margin-bottom:15px;border-bottom:2px solid #1a73e8;padding-bottom:8px;display:inline-block}
.form-row{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:12px}
.form-field{flex:1;min-width:180px}
.form-field label{display:block;font-size:13px;color:#666;margin-bottom:4px;font-weight:600}
.form-field input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none;transition:border .2s}
.form-field input:focus{border-color:#1a73e8}
.form-field select{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none;background:#fff}
.btn-start{display:block;width:100%;padding:12px;background:#1a73e8;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:8px}
.btn-start:hover{background:#1557b0}
.btn-start:disabled{background:#aaa;cursor:not-allowed}

/* 信息栏 */
.status-bar{background:#f8f9fa;border-radius:10px;padding:15px 20px;margin:15px 0;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;font-size:14px}
.status-bar .item{display:flex;align-items:center;gap:6px;color:#555}
.status-bar .item strong{color:#1a1a2e}
.timer-bar{background:#fff8e1;border-radius:8px;padding:12px 18px;margin:10px 0;text-align:center;border:1px solid #ffe082;display:none}
.timer-bar .timer-text{font-size:18px;font-weight:700;color:#333}
.timer-bar .timer-text.warning{color:#e74c3c;animation:pulse 1s infinite}

/* 题目 */
.q-list{display:flex;flex-direction:column;gap:18px;margin-top:20px}
.q-card{background:#fafbfc;border:1px solid #e8eaed;border-radius:12px;padding:18px 20px}
.q-card .q-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.q-card .q-num{font-weight:700;color:#1a73e8;font-size:15px;min-width:35px}
.q-card .q-badge{padding:3px 10px;border-radius:4px;font-size:12px;font-weight:600;color:#fff;border-radius:4px}
.q-single{background:#1a73e8}.q-multiple{background:#e67e22}.q-judge{background:#27ae60}
.q-card .q-score{font-size:13px;color:#888;white-space:nowrap}
.q-card .q-stem{font-size:15px;line-height:1.6;margin-bottom:12px;color:#222}
.q-card .options{display:flex;flex-direction:column;gap:8px}
.q-card .options label{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:8px;background:#fff;border:1px solid #e8eaed;cursor:pointer;transition:all .2s;line-height:1.4}
.q-card .options label:hover{border-color:#1a73e8;background:#f0f6ff}
.q-card .options label input[type=radio],.q-card .options label input[type=checkbox]{accent-color:#1a73e8;margin-top:3px}

/* 判分反馈 */
.q-card .fb{display:none;margin-top:10px;padding:10px 14px;border-radius:8px;font-size:14px}
.q-card .fb.correct{background:#e6f7e6;color:#1a7a1a;border:1px solid #b3e0b3}
.q-card .fb.wrong{background:#fde8e8;color:#c0392b;border:1px solid #f5c6c5;display:block}
.q-card .fb .correct-ans{color:#1a73e8;font-weight:600}

/* 提交 */
.submit-area{text-align:center;margin:25px 0}
.btn-submit{padding:14px 50px;font-size:18px;border-radius:10px;border:none;background:#1a73e8;color:#fff;font-weight:700;cursor:pointer;transition:all .2s}
.btn-submit:hover{background:#1557b0}
.btn-submit:disabled{background:#aaa;cursor:not-allowed}

/* 结果 */
.result-panel{display:none;margin-top:25px;background:#f8f9fa;border-radius:12px;padding:25px;text-align:center}
.result-panel .score-big{font-size:48px;font-weight:800;margin:10px 0}
.result-panel .score-big.pass{color:#27ae60}.result-panel .score-big.fail{color:#e74c3c}
.result-panel .detail{font-size:16px;color:#555;margin:8px 0}
.result-panel .stat{display:flex;gap:20px;justify-content:center;margin:15px 0}

@keyframes pulse{50%{opacity:.4}}
</style>
</head>

// 验证：计算总分
let totalScore = 0;
EXAM_DATA.questions.forEach(q => { totalScore += q.score; });
console.log('总分校验:', totalScore, '分');

let studentInfo = {};
let examStarted = false;
let examSubmitted = false;
let timerInterval = null;
let timeRemaining = EXAM_DATA.timeLimit * 60;

function getFingerprint() {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  ctx.fillText(navigator.userAgent + screen.width + screen.height, 10, 10);
  return btoa(ctx.fillText + canvas.toDataURL()).slice(0,32);
}

function getAttempts() {
  return parseInt(localStorage.getItem('exam_attempts_' + getFingerprint()) || 0);
}

function incrementAttempts() {
  localStorage.setItem('exam_attempts_' + getFingerprint(), getAttempts() + 1);
}

function startExam() {
  const name = document.getElementById('studentName').value.trim();
  const park = document.getElementById('studentPark').value.trim();
  const role = document.getElementById('studentRole').value.trim();
  
  if(!name || !park || !role) {
    alert('请完整填写考生信息（姓名、所在园区、岗位名称）！');
    return;
  }
  
  const attempts = getAttempts();
  if(attempts >= EXAM_DATA.maxAttempts) {
    alert('⚠ 您已用完 ' + EXAM_DATA.maxAttempts + ' 次考试机会！');
    return;
  }
  
  studentInfo = { name, park, role };
  examStarted = true;
  
  document.getElementById('showName').textContent = name;
  document.getElementById('showPark').textContent = park;
  document.getElementById('showRole').textContent = role;
  document.getElementById('attemptNum').textContent = attempts + '/' + EXAM_DATA.maxAttempts;
  document.getElementById('statusBar').style.display = 'flex';
  document.getElementById('timerBar').style.display = 'block';
  document.getElementById('questionArea').style.display = 'block';
  document.getElementById('startBtn').disabled = true;
  document.getElementById('submitBtn').disabled = false;
  document.querySelectorAll('.form-field input').forEach(e => e.disabled = true);
  
  renderQuestions();
  startTimer();
}

function renderQuestions() {
  const list = document.getElementById('questionList');
  list.innerHTML = '';
  
  const typeLabels = {single:'单选题', multiple:'多选题', judge:'判断题'};
  const typeColors = {single:'q-single', multiple:'q-multiple', judge:'q-judge'};
  
  EXAM_DATA.questions.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    
    let optionsHtml = '';
    if(q.type === 'judge') {
      optionsHtml = q.options.map((o, oi) => 
        `<label><input type="radio" name="q${idx}" value="${oi}"> ${o}</label>`
      ).join('');
    } else {
      const optType = q.type === 'single' ? 'radio' : 'checkbox';
      optionsHtml = q.options.map((o, oi) => 
        `<label><input type="${optType}" name="q${idx}" value="${oi}"> ${o}</label>`
      ).join('');
    }
    
    card.innerHTML = `
      <div class="q-header">
        <span class="q-num">第${idx+1}题</span>
        <span><span class="q-badge ${typeColors[q.type]}">${typeLabels[q.type]}</span></span>
        <span class="q-score">${q.score} 分</span>
      </div>
      <div class="q-stem">${q.stem}</div>
      <div class="options">${optionsHtml}</div>
      <div class="fb" id="fb-${idx}"></div>
    `;
    list.appendChild(card);
  });
}

function startTimer() {
  timeRemaining = EXAM_DATA.timeLimit * 60;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timeRemaining--;
    updateTimerDisplay();
    if(timeRemaining <= 0) {
      clearInterval(timerInterval);
      alert('⏰ 时间到！自动提交');
      submitExam();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.floor(timeRemaining / 60);
  const s = timeRemaining % 60;
  document.getElementById('timerText').textContent = 
    `⏱ 剩余时间：${m}分${s.toString().padStart(2,'0')}秒`;
}

async function submitExam() {
  if(examSubmitted) return;
  if(!confirm('确认提交答卷？提交后不能修改！')) return;
  examSubmitted = true;
  clearInterval(timerInterval);
  document.getElementById('submitBtn').disabled = true;
  
  // 数据上报
  const reportData = {
    name: studentInfo.name,
    park: studentInfo.park,
    role: studentInfo.role,
    answers: EXAM_DATA.questions.map((q, idx) => {
      const sel = document.querySelector(`input[name="q${idx}"]:checked`);
      return sel ? parseInt(sel.value) : -1;
    }),
    correctCount: 0,
    wrongCount: 0
  };
  const reportData = {
    name: studentInfo.name,
    park: studentInfo.park,
    role: studentInfo.role,
    answers: EXAM_DATA.questions.map((q, idx) => {
      const sel = document.querySelector(`input[name="q${idx}"]:checked`);
      return sel ? parseInt(sel.value) : -1;
    }),
    correctCount: 0,
    wrongCount: 0
  };
  let score = 0;
  let correct = 0;
  let wrong = 0;
  
  EXAM_DATA.questions.forEach((q, idx) => {
    const fb = document.getElementById('fb-' + idx);
    let isCorrect = false;
    let userAns = null;
    
    if(q.type === 'judge') {
      const sel = document.querySelector(`input[name="q${idx}"]:checked`);
      userAns = sel ? parseInt(sel.value) : -1;
      isCorrect = userAns === q.answer;
    } else if(q.type === 'single') {
      const sel = document.querySelector(`input[name="q${idx}"]:checked`);
      userAns = sel ? parseInt(sel.value) : -1;
      isCorrect = userAns === q.answer;
    } else {
      const checks = document.querySelectorAll(`input[name="q${idx}"]:checked`);
      userAns = Array.from(checks).map(c => parseInt(c.value));
      const correctAns = q.answer;
      isCorrect = userAns.length === correctAns.length && userAns.every(v => correctAns.includes(v));
    }
    
    if(isCorrect) {
      score += q.score;
      correct++;
    } else {
      wrong++;
      let ansText = '';
      if(q.type === 'judge') {
        ansText = q.answer === 0 ? '正确' : '错误';
      } else {
        ansText = q.options[q.answer];
      }
      fb.className = 'fb wrong';
      fb.innerHTML = `❌ 错误（正确答案：<span class="correct-ans">${ansText}</span>）`;
    }
  });
  
  document.getElementById('resultPanel').style.display = 'block';
  document.getElementById('scoreDisplay').textContent = score + '分';
  document.getElementById('scoreDisplay').className = 'score-big ' + (score >= EXAM_DATA.passScore ? 'pass' : 'fail');
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('wrongDetail').textContent = 
    `⚠ 错误率：${Math.round(wrong/30*100)}% (${wrong}/30题)`;
  
  const passText = score >= EXAM_DATA.passScore ? '🎉 恭喜通过！' : '😢 未通过（需≥90分）';
  document.getElementById('resultTitle').textContent = passText;
  
  reportData.correctCount = correct;
  reportData.wrongCount = wrong;
  // 上报答题数据到后端
  try {
    await fetch('http://10.9.236.141:5000/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: reportData.name,
        park: reportData.park,
        role: reportData.role,
        score: score,
        total: EXAM_DATA.totalScore,
        pass: score >= EXAM_DATA.passScore,
        correct: reportData.correctCount,
        wrong: reportData.wrongCount,
        title: EXAM_DATA.title
      })
    });
  } catch(e) { console.log('数据上报异常:', e); }
  incrementAttempts();
}
</script>
