<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>考试成绩汇总</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f0f2f5;padding:15px;font-family:sans-serif}
.container{max-width:800px;margin:0 auto;background:#fff;border-radius:16px;padding:20px}
h1{text-align:center;font-size:22px;margin-bottom:5px}
.sub{text-align:center;color:#888;font-size:14px;margin-bottom:20px}
.stats{display:flex;flex-wrap:wrap;justify-content:space-around;margin:15px 0;padding:15px;background:#f0f6ff;border-radius:10px;gap:10px}
.stat-item{text-align:center;min-width:100px}
.stat-num{font-size:20px;font-weight:700;color:#1a73e8}
.stat-label{font-size:13px;color:#666}
table{width:100%;border-collapse:collapse;margin:15px 0;font-size:13px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid #e8eaed}
th{background:#1a73e8;color:#fff;font-weight:600}
tr:nth-child(even){background:#f8f9fa}
.pass{color:#27ae60;font-weight:600}
.fail{color:#e74c3c;font-weight:600}
.refresh{text-align:center;color:#999;font-size:12px;margin-top:15px}
@media (max-width:600px){
  th,td{font-size:12px;padding:6px 4px}
  .stats{gap:5px}
}
</style>
</head>
<body>
<div class="container">
<h1>📊 考试成绩汇总</h1>
<div class="sub">数据实时自动更新</div>
<div class="stats" id="stats">
  <div class="stat-item"><div class="stat-num" id="totalCount">0</div><div class="stat-label">总考试人次</div></div>
  <div class="stat-item"><div class="stat-num" id="passCount" style="color:#27ae60">0</div><div class="stat-label">通过人数</div></div>
  <div class="stat-item"><div class="stat-num" id="failCount" style="color:#e74c3c">0</div><div class="stat-label">未通过人数</div></div>
  <div class="stat-item"><div class="stat-num" id="avgScore">0</div><div class="stat-label">平均分</div></div>
</div>
<table><thead><tr><th>序号</th><th>姓名</th><th>园区</th><th>岗位</th><th>得分</th><th>结果</th><th>时间</th></tr></thead><tbody id="tbody"></tbody></table>
<div class="refresh">⏱ 页面每 30 秒自动刷新 | <a href="javascript:location.reload()" style="color:#1a73e8">手动刷新</a></div>
</div>
<script>
var WEBHOOK_UUID = "71afd3a6-cdbf-45c1-98a0-bf65f6600d33";  // 从 create_webhook.py 获取的 webhook UUID
var INTERVAL = setInterval(load, 30000);
function load(){
  fetch('https://webhook.site/token/'+WEBHOOK_UUID+'/requests?sorting=newest')
    .then(r=>r.json())
    .then(d=>{
      var posts = (d.data||[]).filter(function(r){return r.method=='POST'});
      var tbody=document.getElementById('tbody'), rows='';
      var total=posts.length, pass=0, fail=0, sumS=0;
      posts.forEach(function(r,i){
        var p = new URLSearchParams(r.content||'');
        var name=p.get('name')||'-', park=p.get('park')||'-', role=p.get('role')||'-';
        var score=parseInt(p.get('score'))||0, result=p.get('result')||'未通过';
        var time=p.get('time')||'-';
        if(result=='通过'||result=='过关') pass++; else fail++;
        sumS+=score;
        rows += '<tr><td>'+(total-i)+'</td><td>'+esc(name)+'</td><td>'+esc(park)+'</td><td>'+esc(role)+'</td><td>'+score+'/100</td><td class="'+(result=='通过'||result=='过关'?'pass':'fail')+'">'+(result)+'</td><td>'+esc(time)+'</td></tr>';
      });
      tbody.innerHTML = rows;
      document.getElementById('totalCount').textContent = total;
      document.getElementById('passCount').textContent = pass;
      document.getElementById('failCount').textContent = fail;
      document.getElementById('avgScore').textContent = total>0 ? Math.round(sumS/total) : 0;
    }).catch(function(){});
}
function esc(s){return String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;')}
load();
</script>
</body>
</html>
