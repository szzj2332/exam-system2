<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#f0f2f5;padding:15px;min-height:100vh}
.container{max-width:800px;margin:0 auto;background:#fff;border-radius:16px;padding:20px}
h1{text-align:center;font-size:22px;margin-bottom:5px}
.sub{text-align:center;color:#888;font-size:14px;margin-bottom:15px;border-bottom:1px solid #eee;padding-bottom:10px}

/* 考生信息 */
.info-box{background:#f8f9fa;border-radius:10px;padding:15px;margin-bottom:15px}
.info-box h3{font-size:15px;margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid #1a73e8;display:inline-block}
.info-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.info-field{flex:1;min-width:150px}
.info-field label{display:block;font-size:13px;color:#666;margin-bottom:4px;font-weight:600}
.info-field input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px;outline:none}
.info-field input:focus{border-color:#1a73e8}
.btn-start{display:block;width:100%;padding:12px;background:#1a73e8;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
.btn-start:disabled{background:#aaa}

/* 状态栏
.status-bar{background:#f8f9fa;border-radius:10px;padding:12px 15px;margin:12px 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;font-size:14px}
.status-item{display:flex;align-items:center;gap:5px;color:#555}
.status-item strong{color:#333}}

/* 倒计时 */
.timer-bar{background:#fff8e1;border-radius:8px;padding:12px 15px;margin:10px 0;text-align:center;border:1px solid #ffe082;display:none}
.timer-text{font-size:18px;font-weight:700;color:#333}
.timer-text.warning{color:#e74c3c}

/* 题目 */
.q-list{display:flex;flex-direction:column;gap:15px;margin-top:15px}
.q-card{background:#fafbfc;border:1px solid #e8eaed;border-radius:12px;padding:15px}
.q-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.q-num{font-weight:600;color:#1a73e8;min-width:35px}
.q-badge{font-size:12px;padding:2px 8px;border-radius:4px;color:#fff;font-weight:600}
.q-badge.single{background:#1a73e8}
.q-badge.multiple{background:#e67e22}
.q-badge.judge{background:#27ae60}
.q-score{font-size:13px;color:#888}
.q-stem{font-size:15px;margin-bottom:10px;line-height:1.6;color:#222}
.options label{display:flex;align-items:flex-start;gap:10px;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #e8eaed;cursor:pointer;font-size:14px}
.fb{margin-top:8px;padding:8px;border-radius:8px;font-size:14px;display:none}
.fb.correct{background:#e6f7e6;color:#1a7a1a;border:1px solid #b3e0b3;display:block}
.fb.wrong{background:#fde8e8;color:#c0392b;border:1px solid #f5c6c5;display:block}
.fb .ans{color:#1a73e8;font-weight:600}

/* 提交与结果 */
.btn-submit{padding:12px 40px;font-size:16px;border-radius:10px;border:none;background:#1a73e8;color:#fff;font-weight:600;cursor:pointer;transition:all .2s;display:block;margin:20px auto 0}
.btn-submit:disabled{background:#aaa}
.btn-submit:hover{background:#1557b0}
.result-panel{display:none;margin-top:20px;background:#f8f9fa;border-radius:12px;padding:20px;text-align:center}
.result-panel .score-big{font-size:42px;font-weight:700;margin:10px 0}
.score-big.pass{color:#27ae60}
.score-big.fail{color:#e74c3c}
.result-panel .detail{font-size:15px;color:#555;margin:8px 0}
.result-panel .stat{display:flex;gap:15px;justify-content:center;margin:10px 0}

      </div>
      <div class="info-field">

  <!-- 倒计时 -->
  <div class="timer-bar" id="timerBar">
    <span class="timer-text" id="timerText">⏱ 剩余时间：0分00秒</span>
  </div>

  <!-- 题目区 -->
  <div id="questionArea" style="display:none">
    <div class="q-list" id="questionList"></div>
    <button class="btn-submit" id="submitBtn" onclick="submit()">📤 提交答卷</button>

  <!-- 结果 -->
  <div class="result-panel" id="resultPanel">
    <h2 id="resultTitle"></h2>
    <div class="score-big" id="scoreDisplay">0</div>
    <div class="stat">

    <div class="detail" id="wrongDetail"></div>
    <button onclick="location.reload()" style="padding:10px 30px;border-radius:8px;border:none;background:#1a73e8;color:#fff;font-weight:600;cursor:pointer;margin-top:15px">🔄 重新考试</button>
  </div>
</div>

    var role = document.getElementById('role').value.trim();
    if(!name || !park || !role) { alert('请完整填写所有信息！'); return; }
    if (getAttempts() >= EXAM_DATA.maxAttempts) { alert('您已用完所有考试次数！'); return; }

    document.getElementById('startBtn').disabled = true;
    document.getElementById('showName').textContent = name;
    document.getElementById('showPark').textContent = park;
    document.getElementById('showRole').textContent = role;
    document.getElementById('attemptNum').textContent = getAttempts() + '/' + EXAM_DATA.maxAttempts;
    document.getElementById('statusBar').style.display = 'flex';
    document.getElementById('timerBar').style.display = 'block';
    document.getElementById('questionArea').style.display = 'block';

    renderQuestions();
    startTimer();
  }

  function renderQuestions() {
    var list = document.getElementById('questionList');
    list.innerHTML = '';
    EXAM_DATA.questions.forEach(function(q, i) {
      var typeL = {single:'单选',multiple:'多选',judge:'判断'};
      var typeB = {single:'single',multiple:'multiple',judge:'judge'};
      var r = '<div class="q-card"><div class="q-header"><span class="q-num">第'+(i+1)+'题</span><span class="q-badge ' + typeB[q.type] + '">' + typeL[q.type] + '</span><span class="q-score">' + q.score + '分</span></div><div class="q-stem">' + q.stem + '</div><div class="options">';
      r += q.options.map(function(o, oi) {
        var t = (q.type == 'judge' || q.type == 'single') ? 'radio' : 'checkbox';
        return '<label><input type="' + t + '" name="q' + i + '" value="' + oi + '">' + o + '</label>';
      }).join('');
      r += '</div><div class="fb" id="fb-' + i + '"></div></div>';
      list.innerHTML += r;
    });
  }

  function startTimer() {
    var remaining = EXAM_DATA.timeLimit * 60;
    var timer = setInterval(function() {
      remaining--;
      var m = Math.floor(remaining / 60), s = remaining % 60;
      document.getElementById('timerText').textContent = '⏱ 剩余时间：' + m + '分' + s.toString().padStart(2,'0') + '秒';
      if (remaining <= 0) { clearInterval(timer); alert('时间到！'); submit(); }
    }, 1000);
    window._examTimer = timer;
  }

  function submit() {
    if (window._examSubmitted) return;
    if (!confirm('确认提交？')) return;
    window._examSubmitted = true;
    clearInterval(window._examTimer || 0);
    document.getElementById('submitBtn').disabled = true;

    var score = 0, correct = 0, wrong = 0;
    EXAM_DATA.questions.forEach(function(q, i) {
      var ans = [];
      if (q.type == 'judge' || q.type == 'single') {
        var sel = document.querySelector('input[name="q' + i + '"]:checked');
        ans = sel ? [parseInt(sel.value)] : [];
      } else {
        var checks = document.querySelectorAll('input[name="q' + i + '"]:checked');
        ans = Array.from(checks).map(function(c) { return parseInt(c.value); });
      }
      var isc = false;
      if (q.type == 'single' || q.type == 'judge') isc = ans.length == 1 && ans[0] == q.answer;
      else {
        var ca = [].concat(q.answer);
        isc = ans.length == ca.length && ans.every(function(v) { return ca.indexOf(v) >= 0; });
      }
      if (isc) { score += q.score; correct++; } else { wrong++; }
      var fb = document.getElementById('fb-' + i);
      if (isc) { fb.className = 'fb correct'; fb.textContent = '✓ 正确'; }
      else { fb.className = 'fb wrong'; fb.textContent = '✗ 错误'; }
    });

    document.getElementById('resultPanel').style.display = 'block';
    var sd = document.getElementById('scoreDisplay');
    sd.textContent = score + '分';
    sd.className = 'score-big ' + (score >= EXAM_DATA.passScore ? 'pass' : 'fail');
    document.getElementById('correctCount').textContent = correct;
    document.getElementById('wrongCount').textContent = wrong;
    var pass = score >= EXAM_DATA.passScore ? '过关' : '未通过';
    document.getElementById('wrongDetail').textContent = '⚠ 错误率：' + Math.round(wrong / EXAM_DATA.questions.length * 100) + '%';

    // 上报到 webhook
    try {
      var name = document.getElementById('name').value;
      var park = document.getElementById('park').value;
      var role = document.getElementById('role').value;
      var now = new Date().toLocaleString();
      var p = 'name=' + encodeURIComponent(name) + '&park=' + encodeURIComponent(park) + '&role=' + encodeURIComponent(role) + '&score=' + score + '&total=' + EXAM_DATA.totalScore + '&result=' + encodeURIComponent(pass) + '&correct=' + correct + '&wrong=' + wrong + '&time=' + encodeURIComponent(now);
      navigator.sendBeacon('https://webhook.site/71afd3a6-cdbf-45c1-98a0-bf65f6600d33', p);
    } catch(e) {}
    incAttempts();
  }

  document.getElementById('submitBtn').disabled = false;
})();
</script>
</body>
</html>
